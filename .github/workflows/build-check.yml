name: Build Check (API + WEB)

on:
  push:
    branches:
      - dev
      - prod
      - "**"

  pull_request:
    branches:
      - dev
      - prod

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # CHECKOUT
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # .NET 10
      # -----------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # -----------------------------
      # RESTORE + BUILD
      # -----------------------------
      - name: Restore
        run: dotnet restore

      - name: Build API
        run: dotnet build src/FluentFlow.Api/FluentFlow.Api.csproj --configuration Release --no-restore

      - name: Build Web
        run: dotnet build src/FluentFlow.Web/FluentFlow.Web/FluentFlow.Web.csproj --configuration Release --no-restore

      - name: Build Web Client
        run: dotnet build src/FluentFlow.Web/FluentFlow.Web.Client/FluentFlow.Web.Client.csproj --configuration Release --no-restore

      # -----------------------------
      # NOTIFICAÇÃO DE SUCESSO (BREVO)
      # -----------------------------
      - name: Email success notification
        if: success()
        run: |
          EVENT_TYPE="${{ github.event_name }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_SHA="${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "https://api.brevo.com/v3/smtp/email" \
          -H "accept: application/json" \
          -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
          -H "content-type: application/json" \
          -d "{
                \"sender\": { \"email\": \"${{ secrets.BREVO_FROM_EMAIL }}\" },
                \"to\": [{ \"email\": \"${{ secrets.BREVO_TO_EMAIL }}\" }],
                \"subject\": \"✔ Build OK — FluentFlow — Branch: ${BRANCH}\",
                \"htmlContent\": \"
                  <h2 style='color:#2e7d32'>✔ Build concluído com sucesso</h2>
                  <table style='border-collapse:collapse;width:100%'>
                    <tr><td style='padding:6px;font-weight:bold'>Workflow</td><td style='padding:6px'>Build Check (API + WEB)</td></tr>
                    <tr style='background:#f5f5f5'><td style='padding:6px;font-weight:bold'>Branch</td><td style='padding:6px'>${BRANCH}</td></tr>
                    <tr><td style='padding:6px;font-weight:bold'>Evento</td><td style='padding:6px'>${EVENT_TYPE}</td></tr>
                    <tr style='background:#f5f5f5'><td style='padding:6px;font-weight:bold'>Autor</td><td style='padding:6px'>${COMMIT_AUTHOR}</td></tr>
                    <tr><td style='padding:6px;font-weight:bold'>Commit</td><td style='padding:6px'>${COMMIT_MSG}</td></tr>
                    <tr style='background:#f5f5f5'><td style='padding:6px;font-weight:bold'>SHA</td><td style='padding:6px'>${COMMIT_SHA:0:8}</td></tr>
                    <tr><td style='padding:6px;font-weight:bold'>Runner</td><td style='padding:6px'>${{ runner.os }}</td></tr>
                    <tr style='background:#f5f5f5'><td style='padding:6px;font-weight:bold'>Data/Hora</td><td style='padding:6px'>$(date -u '+%Y-%m-%d %H:%M:%S UTC')</td></tr>
                  </table>
                  <br>
                  <a href='${RUN_URL}' style='background:#1976d2;color:white;padding:10px 20px;text-decoration:none;border-radius:4px'>
                    Ver no GitHub Actions
                  </a>
                \"
              }"

      # -----------------------------
      # NOTIFICAÇÃO DE ERRO (BREVO)
      # -----------------------------
      - name: Email failure notification
        if: failure()
        run: |
          EVENT_TYPE="${{ github.event_name }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_SHA="${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "https://api.brevo.com/v3/smtp/email" \
          -H "accept: application/json" \
          -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
          -H "content-type: application/json" \
          -d "{
                \"sender\": { \"email\": \"${{ secrets.BREVO_FROM_EMAIL }}\" },
                \"to\": [{ \"email\": \"${{ secrets.BREVO_TO_EMAIL }}\" }],
                \"subject\": \"❌ Build Falhou — FluentFlow — Branch: ${BRANCH}\",
                \"htmlContent\": \"
                  <h2 style='color:#c62828'>❌ Build falhou</h2>
                  <table style='border-collapse:collapse;width:100%'>
                    <tr><td style='padding:6px;font-weight:bold'>Workflow</td><td style='padding:6px'>Build Check (API + WEB)</td></tr>
                    <tr style='background:#f5f5f5'><td style='padding:6px;font-weight:bold'>Branch</td><td style='padding:6px'>${BRANCH}</td></tr>
                    <tr><td style='padding:6px;font-weight:bold'>Evento</td><td style='padding:6px'>${EVENT_TYPE}</td></tr>
                    <tr style='background:#f5f5f5'><td style='padding:6px;font-weight:bold'>Autor</td><td style='padding:6px'>${COMMIT_AUTHOR}</td></tr>
                    <tr><td style='padding:6px;font-weight:bold'>Commit</td><td style='padding:6px'>${COMMIT_MSG}</td></tr>
                    <tr style='background:#f5f5f5'><td style='padding:6px;font-weight:bold'>SHA</td><td style='padding:6px'>${COMMIT_SHA:0:8}</td></tr>
                    <tr><td style='padding:6px;font-weight:bold'>Runner</td><td style='padding:6px'>${{ runner.os }}</td></tr>
                    <tr style='background:#f5f5f5'><td style='padding:6px;font-weight:bold'>Data/Hora</td><td style='padding:6px'>$(date -u '+%Y-%m-%d %H:%M:%S UTC')</td></tr>
                  </table>
                  <br>
                  <p style='color:#c62828'>Consulte os logs no GitHub Actions para mais detalhes.</p>
                  <a href='${RUN_URL}' style='background:#c62828;color:white;padding:10px 20px;text-decoration:none;border-radius:4px'>
                    Ver logs no GitHub Actions
                  </a>
                \"
              }"
